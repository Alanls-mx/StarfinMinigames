network:
  enabled: false
  network-id: starfin-network
  lobby-server: auth
  server-timeout-seconds: 30
  servers:
    bedwars-01: survival
mysql:
  enabled: false
  host: localhost
  port: 3306
  database: starfin
  username: root
  password: ''
  ssl-mode: PREFERRED
matchmaking:
  enabled: true
  reservation-timeout-seconds: 15
  prefer-existing-matches: true
party-matchmaking:
  enabled: true
  allow-solo-party: true
  arrival-grace-seconds: 20
  partial-transfer-policy: CANCEL_PENDING
ranked-matchmaking:
  enabled: false
  auth:
    require-starfin-login: true
  modes:
    solo: true
    duo: true
    trio: true
    squad: true
    custom: false
  arenas:
    allowed-groups: [ranked]
  search:
    initial-rating-range: 250
    expansion-interval-seconds: 30
    expansion-amount: 75
    maximum-rating-range: 600
  party:
    maximum-rating-difference: 400
    allow-solo-party: false
  teams:
    balance-enabled: true
    maximum-average-rating-difference: 250
  queue:
    heartbeat-seconds: 5
    stale-entry-seconds: 30
    transfer-seconds: 60
    allocation-seconds: 120
messages:
  prefix: '&b&lStarfin &8» '
  matchmaking-unavailable: '&cMatchmaking indisponivel neste momento.'
  search-in-progress: '&eJa existe uma busca em andamento.'
  transfer-pending: '&eJa existe uma transferencia pendente para voce.'
  catalog-error: '&cNao foi possivel consultar as partidas agora.'
  arena-unavailable: '&eNenhuma arena disponivel para {game} {mode}.'
  destination-unavailable: '&cDestino indisponivel ou voce ja esta nesse servidor.'
  connection-failed: '&cNao foi possivel conectar ao servidor da partida.'
  connecting: '&aConectando a arena {arena}...'
  proxy-busy: '&cO proxy esta ocupado. Tente novamente em instantes.'
  party-unavailable: '&cNao foi possivel consultar sua Party.'
  party-leader-only: '&eApenas o lider da Party pode procurar partida para o grupo.'
  party-members-unavailable: '&eTodos os membros online da Party precisam estar neste proxy e no lobby.'
  party-arena-unavailable: '&eNenhuma arena tem vagas para toda a Party neste modo.'
  party-changed: '&eA Party ou a conexao de um membro mudou. Tente novamente.'
  party-transfer-partial: '&cUm membro nao conseguiu entrar. A Party permanece formada.'
  party-oversized: '&cSua Party possui {size} jogadores, mas cada equipe suporta no maximo {capacity}.'
  party-no-team: '&cNao existe uma equipe com vagas suficientes para sua Party.'
  party-solo-disabled: '&eParties nao podem entrar juntas no modo Solo.'
  ranked-unavailable: '&cAs ranqueadas estao temporariamente indisponiveis.'
  ranked-joined: '&aVoce entrou na fila ranqueada {mode}.'
  ranked-found: '&aPartida encontrada! Preparando sua equipe...'
  ranked-left: '&eVoce saiu da fila ranqueada.'
  ranked-party-changed: '&eSua Party mudou; a busca ranqueada foi cancelada.'
  ranked-suspended: '&cEntrada ranqueada suspensa por mais {minutes} minuto(s).'
