network:
  enabled: false
  network-id: starfin-network
  lobby-server: auth
  server-timeout-seconds: 30
  servers:
    bedwars-01: survival
mysql:
  enabled: false
  host: localhost
  port: 3306
  database: starfin
  username: root
  password: ''
  ssl-mode: PREFERRED
matchmaking:
  enabled: true
  reservation-timeout-seconds: 15
  prefer-existing-matches: true
